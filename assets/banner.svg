<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="orb-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="orb-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 15px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .stat-num {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 16px;
      fill: #f8fafc;
    }
    .stat-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: #64748b;
    }

    /* Dynamic / Animated elements */
    @keyframes pulse-flow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes float-node {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes dash-move {
      to { stroke-dashoffset: -40; }
    }

    .pulse-orb-1 {
      animation: pulse-flow 7s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .pulse-orb-2 {
      animation: pulse-flow 9s ease-in-out infinite reverse;
      transform-origin: 1000px 300px;
    }
    .floating-card {
      animation: float-node 5s ease-in-out infinite;
    }
    .dash-line {
      stroke-dasharray: 6, 6;
      animation: dash-move 3s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/>
  <rect width="1200" height="420" fill="url(#grid)" rx="16"/>

  <!-- Glowing Dynamic Ambient Orbs in Background -->
  <circle cx="220" cy="90" r="180" fill="url(#orb-blue)" class="pulse-orb-1"/>
  <circle cx="1020" cy="310" r="220" fill="url(#orb-purple)" class="pulse-orb-2"/>

  <!-- Dynamic Circuit / Topology Flow in Background (Deep beneath text) -->
  <g opacity="0.35">
    <path d="M 150 350 L 320 350 L 400 310 L 800 310 L 880 350 L 1050 350" fill="none" stroke="#38bdf8" stroke-width="2" class="dash-line"/>
    <circle cx="400" cy="310" r="4" fill="#38bdf8"/>
    <circle cx="800" cy="310" r="4" fill="#818cf8"/>
    <circle cx="320" cy="350" r="3" fill="#a855f7"/>
    <circle cx="880" cy="350" r="3" fill="#38bdf8"/>
  </g>

  <!-- Main Banner Header Box (Clear Foreground) -->
  <g transform="translate(80, 55)">
    <!-- Tagline Badge -->
    <rect x="0" y="0" width="310" height="30" rx="15" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1"/>
    <circle cx="15" cy="15" r="5" fill="#38bdf8" filter="url(#soft-glow)"/>
    <text x="30" y="20" class="tagline-text">Curated Infrastructure Guide</text>

    <!-- Main Title -->
    <text x="0" y="80" class="title-text" fill="url(#title-grad)" filter="url(#soft-glow)">Awesome Email Administration</text>
    <text x="0" y="125" class="title-text" fill="#f8fafc">&amp; Control Panels</text>

    <!-- Subtitle -->
    <text x="0" y="168" class="subtitle-text">Curated Directory of Mail Server Management, SaaS Consoles &amp; Self-Hosted Control Panels</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 205)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="175" height="36" rx="18" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2"/>
      <text x="18" y="23" class="pill-text">✉️ SMTP / IMAP / POP3</text>

      <!-- Pill 2 -->
      <rect x="190" y="0" width="165" height="36" rx="18" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2"/>
      <text x="208" y="23" class="pill-text">🛡️ Spam &amp; Security</text>

      <!-- Pill 3 -->
      <rect x="370" y="0" width="180" height="36" rx="18" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2"/>
      <text x="388" y="23" class="pill-text">🐳 Docker &amp; Self-Hosted</text>

      <!-- Pill 4 -->
      <rect x="565" y="0" width="165" height="36" rx="18" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2"/>
      <text x="583" y="23" class="pill-text">☁️ Enterprise SaaS</text>

      <!-- Pill 5 -->
      <rect x="745" y="0" width="165" height="36" rx="18" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2"/>
      <text x="763" y="23" class="pill-text">⚙️ DNS &amp; DKIM/SPF</text>
    </g>
  </g>

  <!-- Interactive / Dynamic Side Card (Visual Dashboard Miniature) -->
  <g transform="translate(940, 70)" class="floating-card">
    <rect width="180" height="150" rx="12" fill="url(#card-grad)" stroke="#475569" stroke-width="1.2" filter="url(#glow)"/>
    <rect x="15" y="18" width="8" height="8" rx="4" fill="#22c55e"/>
    <text x="30" y="26" class="stat-label">STATUS: HEALTHY</text>
    
    <text x="16" y="62" class="stat-num">9+ SaaS Leaders</text>
    <text x="16" y="78" class="stat-label">Enterprise &amp; Web Hosts</text>

    <text x="16" y="112" class="stat-num">10+ Open Source</text>
    <text x="16" y="128" class="stat-label">Sorted by GitHub Stars</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#title-grad)"/>
</svg>